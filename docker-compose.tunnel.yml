# Remote Tunnel (premium, remote_tunnel): the tunnel service for Agent Tunnel connectors.
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
# Set ATGLANCE_TUNNEL_SECRET in .env (openssl rand -hex 32), the same value for app and tunnel.
# Connectors dial TUNNEL_PORT (default 8443); publish it as 443 on a dedicated IP/hostname if
# the remote firewall only allows 443. See docs/AGENT_TUNNEL.md.
x-tunnel-env: &tunnel-env
  ATGLANCE_TUNNEL_SECRET: ${ATGLANCE_TUNNEL_SECRET:?set ATGLANCE_TUNNEL_SECRET in .env}
  ATGLANCE_TUNNEL_URL: http://tunnel:8081

services:
  app:
    environment:
      <<: *tunnel-env
      ATGLANCE_TUNNEL_PUBLIC_URL: ${ATGLANCE_TUNNEL_PUBLIC_URL:-}
  worker:
    environment:
      <<: *tunnel-env
  scheduler:
    environment:
      <<: *tunnel-env

  tunnel:
    image: ${ATGLANCE_REGISTRY:-atglance}/ce-atglance-tunnel:${ATGLANCE_VERSION:-3.0.0}
    container_name: ce-atglance-tunnel
    restart: unless-stopped
    environment:
      ATGLANCE_TUNNEL_SECRET: ${ATGLANCE_TUNNEL_SECRET}
      ATGLANCE_APP_URL: http://app:8000
      # Names in the tunnel service's certificate (the host connectors dial).
      TUNNEL_PUBLIC_NAMES: ${TUNNEL_PUBLIC_NAMES:-tunnel}
      ATGLANCE_TUNNEL_PUBLIC_URL: ${ATGLANCE_TUNNEL_PUBLIC_URL:-}
      # Optional public-CA certificate for the published gateway (docs/PUBLISHED_GATEWAY.md):
      # put fullchain.pem and privkey.pem in ./tunnel-certs and set both.
      TUNNEL_CERT_FILE: ${TUNNEL_CERT_FILE:-}
      TUNNEL_KEY_FILE: ${TUNNEL_KEY_FILE:-}
    volumes:
      - ./tunnel-certs:/etc/atglance-tunnel/certs:ro
    # No published port here: Direct and bastion/proxy sessions run inside the Docker network
    # (Caddy /tunnel/* -> tunnel:8081). Agent Tunnel connectors need the connector port: add
    # docker-compose.tunnel-connectors.yml (TUNNEL_PORT, default 8443).
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      app:
        condition: service_healthy
